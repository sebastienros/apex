name: PR Checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  drivers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project:
          - tests/Apex.SqlClient.Tests/Apex.SqlClient.Tests.csproj
          - tests/Apex.PgClient.Tests/Apex.PgClient.Tests.csproj
          - tests/Apex.MySqlClient.Tests/Apex.MySqlClient.Tests.csproj
          - tests/Apex.MsSqlClient.Tests/Apex.MsSqlClient.Tests.csproj
          - tests/Apex.SqlClient.AzureIdentity.Tests/Apex.SqlClient.AzureIdentity.Tests.csproj
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        run: dotnet --version
      - name: Test
        timeout-minutes: 1
        run: dotnet test --project ${{ matrix.project }} --configuration Release

  databases:
    uses: ./.github/workflows/tests.yml