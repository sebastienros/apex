name: PR Checks

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  drivers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        project:
          - tests/Apex.SqlClient.Tests/Apex.SqlClient.Tests.csproj
          - tests/Apex.SqlClient.AdoNet.Tests/Apex.SqlClient.AdoNet.Tests.csproj
          - tests/Apex.PgClient.Tests/Apex.PgClient.Tests.csproj
          - tests/Apex.MySqlClient.Tests/Apex.MySqlClient.Tests.csproj
          - tests/Apex.MsSqlClient.Tests/Apex.MsSqlClient.Tests.csproj
          - tests/Apex.SqlClient.AzureIdentity.Tests/Apex.SqlClient.AzureIdentity.Tests.csproj
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version
        run: dotnet --version
      # The default NuGet cache (%USERPROFILE%\.nuget\packages) is on the slower C: OS disk on
      # Windows runners. runner.temp is on the fast local disk that also holds the workspace.
      - name: Use the local disk for the NuGet cache
        if: runner.os == 'Windows'
        run: Add-Content -Path $env:GITHUB_ENV -Value "NUGET_PACKAGES=${{ runner.temp }}\nuget-packages"
      # Restore and build outside the Test step: on a cold Windows runner restore and build
      # together take close to a minute, while the tests finish in seconds.
      - name: Restore
        timeout-minutes: 5
        run: dotnet restore "${{ github.workspace }}/${{ matrix.project }}"
      - name: Build
        timeout-minutes: 5
        run: dotnet build "${{ github.workspace }}/${{ matrix.project }}" --configuration Release --no-restore
      - name: Test
        timeout-minutes: 2
        run: dotnet test --project "${{ github.workspace }}/${{ matrix.project }}" --configuration Release --no-build

  databases:
    uses: ./.github/workflows/tests.yml