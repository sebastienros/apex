name: Build

on:
  push:
    branches: [ main ]

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test
        run: |
          dotnet test --project tests/Apex.SqlClient.Tests/Apex.SqlClient.Tests.csproj --configuration Release
          dotnet test --project tests/Apex.PgClient.Tests/Apex.PgClient.Tests.csproj --configuration Release
          dotnet test --project tests/Apex.MySqlClient.Tests/Apex.MySqlClient.Tests.csproj --configuration Release
          dotnet test --project tests/Apex.MsSqlClient.Tests/Apex.MsSqlClient.Tests.csproj --configuration Release
      - name: Pack
        run: dotnet pack Apex.slnx --configuration Release --output artifacts -p:PackageVersion=0.1.${{ github.run_number }} -p:ContinuousIntegrationBuild=true