imports:
  - https://raw.githubusercontent.com/dotnet/crank/main/src/Microsoft.Crank.Jobs.Wrk/wrk.yml
  - https://raw.githubusercontent.com/aspnet/Benchmarks/main/scenarios/aspnet.profiles.standard.yml

variables:
  serverPort: 5000
  npgsqlConnections: 256
  # Override this value to benchmark an unmerged branch.
  branchOrCommit: main

jobs:
  # Crank combines SDK transport feeds; extend the repository's CS1591 suppression with NU1507.
  platform-postgresql-apex:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Platform/Apex.Fortunes.Platform.csproj
    framework: net11.0
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: postgresql
      DRIVER: apex
      CONNECTION_STRING: "Host={{databaseServer}};Database=hello_world;Username=benchmarkdbuser;Password=benchmarkdbpass"
      DATABASE_CONNECTIONS: "{{ cores | minus: 2 }}"
      APEX_PIPELINING: 64

  platform-postgresql-npgsql:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Platform/Apex.Fortunes.Platform.csproj
    framework: net11.0
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: postgresql
      DRIVER: npgsql
      CONNECTION_STRING: "Host={{databaseServer}};Database=hello_world;Username=benchmarkdbuser;Password=benchmarkdbpass;Maximum Pool Size={{ npgsqlConnections }};NoResetOnClose=true;Enlist=false;Max Auto Prepare=4"
      DATABASE_CONNECTIONS: "{{ npgsqlConnections }}"

  platform-mysql-apex:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Platform/Apex.Fortunes.Platform.csproj
    framework: net11.0
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: mysql
      DRIVER: apex
      CONNECTION_STRING: "Server={{databaseServer}};Database=hello_world;User ID=benchmarkdbuser;Password=benchmarkdbpass;SslMode=Disabled;AllowPublicKeyRetrieval=true"
      DATABASE_CONNECTIONS: "{{ cores | minus: 2 }}"

  platform-mysql-mysqlconnector:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Platform/Apex.Fortunes.Platform.csproj
    framework: net11.0
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: mysql
      DRIVER: mysqlconnector
      CONNECTION_STRING: "Server={{databaseServer}};Database=hello_world;User ID=benchmarkdbuser;Password=benchmarkdbpass;SslMode=Disabled;AllowPublicKeyRetrieval=true;Connection Reset=false;Auto Enlist=false;Default Command Timeout=0;Use Affected Rows=true;Minimum Pool Size={{ cores | minus: 2 }};Maximum Pool Size={{ cores | minus: 2 }}"
      DATABASE_CONNECTIONS: "{{ cores | minus: 2 }}"

  platform-sqlserver-apex:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Platform/Apex.Fortunes.Platform.csproj
    framework: net11.0
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: sqlserver
      DRIVER: apex
      CONNECTION_STRING: "Server={{databaseServer}};Database=hello_world;User ID=sa;Password=Benchmarkdbp@55;Encrypt=false;TrustServerCertificate=true"
      DATABASE_CONNECTIONS: "{{ cores | minus: 2 }}"

  platform-sqlserver-microsoftdatasqlclient:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Platform/Apex.Fortunes.Platform.csproj
    framework: net11.0
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: sqlserver
      DRIVER: microsoftdatasqlclient
      CONNECTION_STRING: "Server={{databaseServer}};Database=hello_world;User ID=sa;Password=Benchmarkdbp@55;Encrypt=false;TrustServerCertificate=true"
      DATABASE_CONNECTIONS: "{{ cores | minus: 2 }}"

  postgresql:
    source:
      repository: https://github.com/TechEmpower/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: toolset/databases/postgres/postgres.dockerfile
      dockerImageName: postgres_te
      dockerContextDirectory: toolset/databases/postgres
    readyStateText: ready to accept connections
    noClean: true

  mysql:
    source:
      repository: https://github.com/TechEmpower/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: toolset/databases/mysql/mysql.dockerfile
      dockerImageName: mysql_te
      dockerContextDirectory: toolset/databases/mysql
    readyStateText: ready for connections. Bind-address
    noClean: true

  sqlserver:
    source:
      repository: https://github.com/aspnet/Benchmarks.git
      branchOrCommit: main
      dockerFile: docker/mssql-techempower/Dockerfile
      dockerImageName: mssql_te
      dockerContextDirectory: docker/mssql-techempower
    readyStateText: Data imported
    noClean: true

scenarios:
  platform-postgresql-apex:
    db:
      job: postgresql
    application:
      job: platform-postgresql-apex
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 512

  platform-postgresql-npgsql:
    db:
      job: postgresql
    application:
      job: platform-postgresql-npgsql
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 512

  platform-mysql-apex:
    db:
      job: mysql
    application:
      job: platform-mysql-apex
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024

  platform-mysql-mysqlconnector:
    db:
      job: mysql
    application:
      job: platform-mysql-mysqlconnector
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024

  platform-sqlserver-apex:
    db:
      job: sqlserver
    application:
      job: platform-sqlserver-apex
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024

  platform-sqlserver-microsoftdatasqlclient:
    db:
      job: sqlserver
    application:
      job: platform-sqlserver-microsoftdatasqlclient
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024
