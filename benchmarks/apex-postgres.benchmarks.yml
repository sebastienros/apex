imports:
  - https://raw.githubusercontent.com/aspnet/Benchmarks/main/scenarios/aspnet.profiles.yml

variables:
  branchOrCommit: main
  concurrency: 16
  duration: 30
  payloadBytes: 4194304
  warmup: 10

jobs:
  application:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.ComparisonHarness/Apex.ComparisonHarness.csproj
    isConsoleApp: true
    waitForExit: true
    arguments: apex
    environmentVariables:
      APEX_BENCH_CONCURRENCY: "{{concurrency}}"
      APEX_BENCH_DATABASE: postgres
      APEX_BENCH_DURATION_SECONDS: "{{duration}}"
      APEX_BENCH_PAYLOAD_BYTES: "{{payloadBytes}}"
      APEX_BENCH_WARMUP_SECONDS: "{{warmup}}"
      APEX_BENCH_WORKLOAD: "{{workload}}"
      APEX_PG_CONNECTION_STRING: "Host={{databaseServer}};Port=5432;Database=apex;Username=apex;Password=apex;SSL Mode={{sslMode}}"
    options:
      requiredOperatingSystem: linux
    metadata:
      - name: apex/operations-per-second
        source: Apex
        aggregate: first
        reduce: first
        shortDescription: Operations/s
        longDescription: Completed operations per second
        format: n2
      - name: apex/latency-p50
        source: Apex
        aggregate: first
        reduce: first
        shortDescription: P50 (ms)
        longDescription: 50th percentile operation latency
        format: n3
      - name: apex/latency-p95
        source: Apex
        aggregate: first
        reduce: first
        shortDescription: P95 (ms)
        longDescription: 95th percentile operation latency
        format: n3
      - name: apex/latency-p99
        source: Apex
        aggregate: first
        reduce: first
        shortDescription: P99 (ms)
        longDescription: 99th percentile operation latency
        format: n3
      - name: apex/allocated-bytes
        source: Apex
        aggregate: first
        reduce: first
        shortDescription: Allocated (B)
        longDescription: Managed bytes allocated
        format: n0
      - name: apex/allocated-bytes-per-operation
        source: Apex
        aggregate: first
        reduce: first
        shortDescription: Allocated/op (B)
        longDescription: Managed bytes allocated per operation
        format: n2
      - name: apex/transfer-mib-per-second
        source: Apex
        aggregate: first
        reduce: first
        shortDescription: Transfer (MiB/s)
        longDescription: Application payload transferred per second
        format: n2
    onConfigure:
      - job.timeout = Number(job.variables.duration) + Number(job.variables.warmup) + 120;

  db:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      dockerFile: benchmarks/docker/postgres-tls/Dockerfile
      dockerImageName: apex-postgres-tls
      dockerContextDirectory: .
    environmentVariables:
      POSTGRES_DB: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_USER: apex
    readyStateText: ready to accept connections

scenarios:
  download-raw:
    db:
      job: db
    application:
      job: application
      variables:
        sslMode: Disable
        workload: download

  download-tls:
    db:
      job: db
    application:
      job: application
      variables:
        sslMode: Require
        workload: download

  upload-raw:
    db:
      job: db
    application:
      job: application
      variables:
        sslMode: Disable
        workload: upload

  upload-tls:
    db:
      job: db
    application:
      job: application
      variables:
        sslMode: Require
        workload: upload
