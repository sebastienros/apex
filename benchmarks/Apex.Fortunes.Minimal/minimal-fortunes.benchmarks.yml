imports:
  - https://raw.githubusercontent.com/dotnet/crank/main/src/Microsoft.Crank.Jobs.Wrk/wrk.yml
  - https://raw.githubusercontent.com/aspnet/Benchmarks/main/scenarios/aspnet.profiles.standard.yml

variables:
  serverPort: 5000
  # Override this value to benchmark an unmerged branch.
  branchOrCommit: main

jobs:
  # Crank combines SDK transport feeds; extend the repository's CS1591 suppression with NU1507.
  minimal-postgresql-apex:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Minimal/Apex.Fortunes.Minimal.csproj
    framework: net10.0
    channel: latest
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: postgresql
      DRIVER: apex
      CONNECTION_STRING: "Host={{databaseServer}};Database=hello_world;Username=benchmarkdbuser;Password=benchmarkdbpass"
      APEX_CONNECTIONS: 56
      APEX_PIPELINING: 16

  minimal-postgresql-npgsql:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Minimal/Apex.Fortunes.Minimal.csproj
    framework: net10.0
    channel: latest
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: postgresql
      DRIVER: npgsql
      CONNECTION_STRING: "Host={{databaseServer}};Database=hello_world;Username=benchmarkdbuser;Password=benchmarkdbpass"
      APEX_CONNECTIONS: 56

  minimal-mysql-apex:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Minimal/Apex.Fortunes.Minimal.csproj
    framework: net10.0
    channel: latest
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: mysql
      DRIVER: apex
      CONNECTION_STRING: "Server={{databaseServer}};Database=hello_world;User ID=benchmarkdbuser;Password=benchmarkdbpass;SslMode=Disabled;AllowPublicKeyRetrieval=true"
      APEX_CONNECTIONS: 64

  minimal-mysql-mysqlconnector:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Minimal/Apex.Fortunes.Minimal.csproj
    framework: net10.0
    channel: latest
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: mysql
      DRIVER: mysqlconnector
      CONNECTION_STRING: "Server={{databaseServer}};Database=hello_world;User ID=benchmarkdbuser;Password=benchmarkdbpass;SslMode=Disabled;AllowPublicKeyRetrieval=true"
      APEX_CONNECTIONS: 64

  minimal-sqlserver-apex:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Minimal/Apex.Fortunes.Minimal.csproj
    framework: net10.0
    channel: latest
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: sqlserver
      DRIVER: apex
      CONNECTION_STRING: "Server={{databaseServer}};Database=hello_world;User ID=sa;Password=Benchmarkdbp@55;Encrypt=false;TrustServerCertificate=true"
      APEX_CONNECTIONS: 64

  minimal-sqlserver-microsoftdatasqlclient:
    source:
      repository: https://github.com/sebastienros/apex.git
      branchOrCommit: "{{branchOrCommit}}"
      project: benchmarks/Apex.Fortunes.Minimal/Apex.Fortunes.Minimal.csproj
    framework: net10.0
    channel: latest
    patchReferences: true
    buildArguments:
      - /p:NoWarn=NU1507%3BCS1591
    readyStateText: Application started.
    arguments: "--urls {{serverScheme}}://{{serverAddress}}:{{serverPort}}"
    variables:
      serverScheme: http
    environmentVariables:
      DATABASE: sqlserver
      DRIVER: microsoftdatasqlclient
      CONNECTION_STRING: "Server={{databaseServer}};Database=hello_world;User ID=sa;Password=Benchmarkdbp@55;Encrypt=false;TrustServerCertificate=true"
      APEX_CONNECTIONS: 64

  postgresql:
    source:
      repository: https://github.com/TechEmpower/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: toolset/databases/postgres/postgres.dockerfile
      dockerImageName: postgres_te
      dockerContextDirectory: toolset/databases/postgres
    readyStateText: ready to accept connections
    noClean: true

  mysql:
    source:
      repository: https://github.com/TechEmpower/FrameworkBenchmarks.git
      branchOrCommit: master
      dockerFile: toolset/databases/mysql/mysql.dockerfile
      dockerImageName: mysql_te
      dockerContextDirectory: toolset/databases/mysql
    readyStateText: Ready for start up
    noClean: true

  sqlserver:
    source:
      repository: https://github.com/aspnet/Benchmarks.git
      branchOrCommit: main
      dockerFile: docker/mssql-techempower/Dockerfile
      dockerImageName: mssql_te
      dockerContextDirectory: docker/mssql-techempower
    readyStateText: Data imported
    noClean: true

scenarios:
  minimal-postgresql-apex:
    db:
      job: postgresql
    application:
      job: minimal-postgresql-apex
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024

  minimal-postgresql-npgsql:
    db:
      job: postgresql
    application:
      job: minimal-postgresql-npgsql
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024

  minimal-mysql-apex:
    db:
      job: mysql
    application:
      job: minimal-mysql-apex
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024

  minimal-mysql-mysqlconnector:
    db:
      job: mysql
    application:
      job: minimal-mysql-mysqlconnector
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024

  minimal-sqlserver-apex:
    db:
      job: sqlserver
    application:
      job: minimal-sqlserver-apex
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024

  minimal-sqlserver-microsoftdatasqlclient:
    db:
      job: sqlserver
    application:
      job: minimal-sqlserver-microsoftdatasqlclient
    load:
      job: wrk
      variables:
        presetHeaders: html
        path: /fortunes
        connections: 1024
